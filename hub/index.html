<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Hub — one question, the right desk</title>
<meta name="description" content="A student help desk that reads the question, works out which university department owns it, and lets the student follow it from asked to answered.">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Student Hub">
<meta property="og:description" content="Reads the question, finds the right department, tracks it to an answer.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    --ink:#07070B; --panel:#0E0E14; --panel-2:#12121A; --panel-3:#171721;
    --line:#23232F; --line-soft:#1A1A24;
    --white:#F6F6FA; --muted:#8B8B9C; --muted-2:#6A6A7C;
    --yellow:#FFD84D; --pink:#FFB0C8; --blue:#9BD4F5; --green:#9BE8B4; --red:#FF8B8B;

    --display:"Bricolage Grotesque","Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

    --s1:.5rem; --s2:.875rem; --s3:1.25rem; --s4:2rem; --s5:3.25rem;
    --r:14px; --r-sm:9px;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  body{
    margin:0; background:var(--ink); color:var(--white);
    font-family:var(--body); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  html[dir="rtl"] body{font-family:var(--body)}

  a{color:inherit}
  button,input,select,textarea{font:inherit;color:inherit}

  .wrap{max-width:1060px;margin:0 auto;padding:0 var(--s3)}

  /* --- demonstration banner ------------------------------------------- */
  .demo{
    background:linear-gradient(90deg,rgba(255,216,77,.14),rgba(255,176,200,.10));
    border-bottom:1px solid var(--line);
    font-size:.8125rem; color:var(--yellow);
    padding:.55rem var(--s3); text-align:center;
  }
  .demo b{color:var(--white);font-weight:600}

  /* --- header ---------------------------------------------------------- */
  header{border-bottom:1px solid var(--line);background:var(--panel)}
  .head{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) 0;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:.7rem;text-decoration:none;min-height:44px}
  .mark{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(140deg,var(--yellow),var(--pink));
    display:grid;place-items:center;color:#0B0B10;font-weight:800;
    font-family:var(--display);font-size:1rem;
  }
  .logo-text{font-family:var(--display);font-weight:600;font-size:1.0625rem;letter-spacing:-.01em}
  .logo-text small{display:block;font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--muted)}
  .head-actions{margin-inline-start:auto;display:flex;align-items:center;gap:.4rem}

  .chip{
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:.35rem .75rem;font-size:.75rem;cursor:pointer;
    min-height:36px;display:inline-flex;align-items:center;gap:.4rem;
  }
  .chip:hover{border-color:var(--muted-2);color:var(--white)}
  .chip[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white);font-weight:600}

  /* --- tabs ------------------------------------------------------------ */
  nav.tabs{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .tabs-inner{display:flex;gap:.15rem;overflow-x:auto;scrollbar-width:none}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{
    background:none;border:0;border-bottom:2px solid transparent;
    padding:.8rem .85rem;font-size:.875rem;color:var(--muted);cursor:pointer;
    white-space:nowrap;min-height:46px;
  }
  .tab:hover{color:var(--white)}
  .tab[aria-selected="true"]{color:var(--white);border-bottom-color:var(--yellow);font-weight:600}
  .tab .dot{
    display:inline-block;min-width:18px;padding:0 .3rem;margin-inline-start:.35rem;
    background:var(--yellow);color:var(--ink);border-radius:999px;
    font-size:.6875rem;font-weight:700;line-height:18px;text-align:center;
  }

  main{padding:var(--s4) 0 var(--s5)}
  section[hidden]{display:none}

  h1{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.15;margin:0 0 .5rem;letter-spacing:-.02em}
  h2{font-family:var(--display);font-size:1.1rem;margin:0 0 var(--s2);letter-spacing:-.01em}
  h3{font-family:var(--display);font-size:.95rem;margin:0}
  .lede{color:var(--muted);margin:0 0 var(--s4);max-width:62ch}

  /* --- search ---------------------------------------------------------- */
  .search{position:relative;margin-bottom:var(--s3)}
  .search svg{position:absolute;inset-inline-start:1rem;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:1rem 1rem 1rem 3rem;font-size:1.0625rem;min-height:58px;
  }
  html[dir="rtl"] .search input{padding:1rem 3rem 1rem 1rem}
  .search input:focus{outline:2px solid var(--yellow);outline-offset:2px;border-color:transparent}

  /* --- cards ----------------------------------------------------------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3)}
  .card + .card{margin-top:var(--s2)}
  .grid{display:grid;gap:var(--s2)}
  .cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
  .cols-3{grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
  .cols-4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
  .side{display:grid;grid-template-columns:1fr;gap:var(--s3)}
  @media(min-width:900px){.side{grid-template-columns:1fr 300px;align-items:start}}

  /* --- category tiles --------------------------------------------------- */
  .tile{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:var(--s2);text-align:start;cursor:pointer;min-height:92px;
    display:flex;flex-direction:column;gap:.5rem;width:100%;
    transition:border-color .15s,transform .15s;
  }
  .tile:hover{border-color:var(--muted-2);transform:translateY(-1px)}
  .tile[aria-pressed="true"]{border-color:var(--yellow)}
  .tile .ico{font-size:1.15rem;line-height:1}
  .tile .nm{font-size:.8125rem;font-weight:500;line-height:1.25}
  .tile .ct{font-size:.6875rem;color:var(--muted-2);margin-top:auto;font-family:var(--mono)}

  /* --- faq ------------------------------------------------------------- */
  .faq{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
  .faq + .faq{margin-top:.5rem}
  .faq button.q{
    width:100%;background:none;border:0;text-align:start;cursor:pointer;
    padding:var(--s2) var(--s3);display:flex;gap:.7rem;align-items:flex-start;min-height:54px;
  }
  .faq button.q:hover{background:var(--panel-2)}
  .faq .caret{color:var(--muted);transition:transform .2s;flex:none;margin-top:.15rem}
  .faq[open-state="1"] .caret{transform:rotate(90deg)}
  html[dir="rtl"] .faq[open-state="1"] .caret{transform:rotate(-90deg)}
  .faq .qt{font-size:.9375rem;font-weight:500}
  .faq .meta{font-size:.75rem;color:var(--muted-2);margin-top:.25rem}
  .faq .a{padding:0 var(--s3) var(--s3) 3.1rem;color:var(--muted);font-size:.9rem;line-height:1.65}
  html[dir="rtl"] .faq .a{padding:0 3.1rem var(--s3) var(--s3)}
  .faq .a .dept{margin-top:var(--s2);padding-top:.7rem;border-top:1px solid var(--line-soft);font-size:.75rem;color:var(--muted-2)}

  /* --- forms ------------------------------------------------------------ */
  label.f{display:block;margin-bottom:var(--s2)}
  label.f > span{display:block;font-size:.8125rem;font-weight:500;margin-bottom:.35rem}
  label.f .hint{font-weight:400;color:var(--muted-2);font-size:.75rem;margin-top:.25rem}
  input[type=text],textarea,select,input[type=file]{
    width:100%;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:.65rem .8rem;font-size:.9375rem;min-height:44px;
  }
  textarea{resize:vertical;line-height:1.55}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--yellow);outline-offset:1px;border-color:transparent}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
    background:var(--yellow);color:var(--ink);border:1px solid var(--yellow);
    border-radius:var(--r-sm);padding:.6rem 1.1rem;font-size:.9375rem;font-weight:600;
    cursor:pointer;min-height:46px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--white);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--muted-2);filter:none}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:.5rem;flex-wrap:wrap}

  /* --- badges ----------------------------------------------------------- */
  .badge{
    display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;
    padding:.15rem .6rem;font-size:.7rem;font-weight:600;border:1px solid;
    white-space:nowrap;
  }
  .b-grey{color:var(--muted);border-color:var(--line);background:var(--panel-2)}
  .b-blue{color:var(--blue);border-color:rgba(155,212,245,.3);background:rgba(155,212,245,.09)}
  .b-yellow{color:var(--yellow);border-color:rgba(255,216,77,.3);background:rgba(255,216,77,.09)}
  .b-green{color:var(--green);border-color:rgba(155,232,180,.3);background:rgba(155,232,180,.09)}
  .b-pink{color:var(--pink);border-color:rgba(255,176,200,.3);background:rgba(255,176,200,.09)}

  /* --- assistant --------------------------------------------------------- */
  .assist{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:var(--s3)}
  .answer{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2) var(--s3)}
  .answer .src{font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);margin-bottom:.5rem}
  .refuse{background:rgba(255,216,77,.07);border:1px solid rgba(255,216,77,.28);border-radius:var(--r-sm);padding:var(--s2) var(--s3)}

  /* --- threads ----------------------------------------------------------- */
  .msg{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2);background:var(--panel-2)}
  .msg + .msg{margin-top:.5rem}
  .msg.staff{background:rgba(155,212,245,.06);border-color:rgba(155,212,245,.22)}
  .msg.note{border-style:dashed;background:rgba(255,216,77,.05);border-color:rgba(255,216,77,.28)}
  .msg .who{font-size:.75rem;font-weight:600;margin-bottom:.35rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .msg .when{color:var(--muted-2);font-weight:400;margin-inline-start:auto;font-family:var(--mono);font-size:.7rem}
  .msg p{margin:0;font-size:.9rem;color:var(--muted);white-space:pre-line;line-height:1.6}

  .qrow{
    width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:var(--s2) var(--s3);cursor:pointer;
  }
  .qrow:hover{border-color:var(--muted-2)}
  .qrow + .qrow{margin-top:.5rem}
  .qrow .t{font-size:.9375rem;font-weight:500}
  .qrow .b{font-size:.8125rem;color:var(--muted);margin:.25rem 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .qrow .f{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--line-soft);font-size:.7rem;color:var(--muted-2)}
  .ref{font-family:var(--mono)}

  /* --- timeline ---------------------------------------------------------- */
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:flex;gap:.6rem;font-size:.75rem;color:var(--muted);padding:.3rem 0}
  .tl .pip{width:6px;height:6px;border-radius:50%;background:var(--yellow);margin-top:.45rem;flex:none}
  .tl time{display:block;color:var(--muted-2);font-family:var(--mono);font-size:.6875rem}

  /* --- stats -------------------------------------------------------------- */
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3)}
  .stat .k{font-size:.6875rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2)}
  .stat .v{font-family:var(--display);font-size:1.6rem;font-weight:600;margin-top:.15rem;font-variant-numeric:tabular-nums}
  .bar{display:flex;align-items:center;gap:.6rem;font-size:.8125rem;padding:.3rem 0}
  .bar .nm{width:38%;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .tr{flex:1;height:8px;background:var(--panel-3);border-radius:999px;overflow:hidden}
  .bar .fl{height:100%;background:var(--yellow);border-radius:999px}
  .bar .vl{font-family:var(--mono);font-size:.75rem;color:var(--muted);min-width:2ch;text-align:end}

  .empty{text-align:center;padding:var(--s4) var(--s3);color:var(--muted)}
  .empty .big{font-size:1.6rem;margin-bottom:.5rem}
  .muted{color:var(--muted)}
  .small{font-size:.8125rem}
  .tiny{font-size:.75rem}
  .mt2{margin-top:var(--s2)} .mt3{margin-top:var(--s3)} .mt4{margin-top:var(--s4)}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  footer{border-top:1px solid var(--line);padding:var(--s4) 0;color:var(--muted-2);font-size:.8125rem}
  footer a{color:var(--muted)}

  .toast{
    position:fixed;inset-inline:0;bottom:1.2rem;display:flex;justify-content:center;
    pointer-events:none;z-index:60;padding:0 var(--s3);
  }
  .toast div{
    background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:.7rem 1.1rem;font-size:.875rem;box-shadow:0 12px 32px rgba(0,0,0,.5);
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<p class="demo">
  <b>Demonstration.</b>
  <span data-t="demoNote">Not a real university system. Nothing is sent anywhere — everything you do here stays in this browser tab.</span>
</p>

<header>
  <div class="wrap head">
    <a class="logo" href="../index.html">
      <span class="mark" aria-hidden="true">SH</span>
      <span class="logo-text">
        <span data-t="brand">Student Hub</span>
        <small data-t="brandSub">One question, the right desk</small>
      </span>
    </a>
    <div class="head-actions">
      <button class="chip" id="roleBtn" type="button"></button>
      <button class="chip" id="langBtn" type="button">العربية</button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Student Hub sections">
  <div class="wrap">
    <div class="tabs-inner" role="tablist" id="tablist"></div>
  </div>
</nav>

<main class="wrap">
  <!-- ===== HOME ===== -->
  <section id="v-home" role="tabpanel">
    <h1 data-t="homeTitle"></h1>
    <p class="lede" data-t="homeLede"></p>

    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input type="text" id="q" autocomplete="off">
    </div>

    <div id="searchResults"></div>

    <div class="side mt4">
      <div>
        <h2 data-t="browse"></h2>
        <div class="grid cols-3" id="tiles"></div>

        <h2 class="mt4" data-t="assistantTitle"></h2>
        <div class="assist">
          <p class="small muted" style="margin-top:0" data-t="assistantIntro"></p>
          <form id="assistForm" class="row" style="align-items:flex-end">
            <label class="f" style="flex:1;min-width:200px;margin-bottom:0">
              <span class="sr" data-t="assistantLabel"></span>
              <input type="text" id="assistInput" autocomplete="off">
            </label>
            <button class="btn" type="submit" data-t="ask"></button>
          </form>
          <div id="assistOut" class="mt3"></div>
        </div>
      </div>

      <aside>
        <div class="card">
          <h3 data-t="notifications"></h3>
          <div id="notifs" class="mt2"></div>
        </div>
        <div class="card mt2">
          <h3 data-t="myQuestions"></h3>
          <div id="homeQuestions" class="mt2"></div>
        </div>
        <div class="card mt2" style="border-color:rgba(255,216,77,.28);background:rgba(255,216,77,.05)">
          <h3 data-t="askTitle"></h3>
          <p class="small muted" data-t="askSub" style="margin:.4rem 0 0"></p>
          <button class="btn mt2" style="width:100%" data-go="ask" data-t="askTitle"></button>
        </div>
      </aside>
    </div>
  </section>

  <!-- ===== ASK ===== -->
  <section id="v-ask" role="tabpanel" hidden>
    <h1 data-t="askTitle"></h1>
    <p class="lede" data-t="askLede"></p>
    <div class="side">
      <form id="askForm" class="card">
        <label class="f">
          <span data-t="fSubject"></span>
          <input type="text" id="aSubject" maxlength="200" required>
          <span class="hint" data-t="fSubjectHint"></span>
        </label>
        <label class="f">
          <span data-t="fCategory"></span>
          <select id="aCategory"></select>
          <span class="hint" data-t="fCategoryHint"></span>
        </label>
        <label class="f">
          <span data-t="fBody"></span>
          <textarea id="aBody" rows="6" maxlength="4000" required></textarea>
          <span class="hint" data-t="fBodyHint"></span>
        </label>
        <label class="f">
          <span data-t="fFiles"></span>
          <input type="file" id="aFiles" multiple accept="image/*,application/pdf">
          <span class="hint" data-t="fFilesHint"></span>
        </label>
        <div class="row mt2">
          <button class="btn" type="submit" data-t="send"></button>
        </div>
        <p class="tiny muted mt3" style="border-top:1px solid var(--line-soft);padding-top:.8rem" data-t="privacy"></p>
      </form>

      <aside class="card" style="background:var(--panel-2)">
        <h3 class="tiny" style="text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2)" data-t="routeTo"></h3>
        <div id="routePreview" class="mt2"></div>
      </aside>
    </div>
  </section>

  <!-- ===== MY QUESTIONS ===== -->
  <section id="v-mine" role="tabpanel" hidden>
    <h1 data-t="myQuestions"></h1>
    <p class="lede" data-t="mineLede"></p>
    <div class="row" id="mineFilters" style="margin-bottom:var(--s3)"></div>
    <div id="mineList"></div>
  </section>

  <!-- ===== THREAD ===== -->
  <section id="v-thread" role="tabpanel" hidden>
    <button class="chip" data-go="mine" style="margin-bottom:var(--s3)">&larr; <span data-t="back"></span></button>
    <div id="threadBody"></div>
  </section>

  <!-- ===== STAFF INBOX ===== -->
  <section id="v-inbox" role="tabpanel" hidden>
    <h1 data-t="inboxTitle"></h1>
    <p class="lede" id="inboxLede"></p>
    <div class="row" id="inboxFilters" style="margin-bottom:var(--s3)"></div>
    <div id="inboxList"></div>
  </section>

  <!-- ===== DASHBOARD ===== -->
  <section id="v-dash" role="tabpanel" hidden>
    <h1 data-t="dashTitle"></h1>
    <p class="lede" data-t="dashLede"></p>
    <div id="dashBody"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p style="margin:0 0 .4rem" data-t="footNote"></p>
    <p style="margin:0"><a href="../index.html" data-t="backToPort"></a></p>
  </div>
</footer>

<div class="toast" id="toast" aria-live="polite"></div>

<script>
/* ============================================================================
   Student Hub — a self-contained prototype.

   No network requests, no build step, no analytics. Everything below runs in
   the tab: the routing engine, the FAQ retrieval, the department queues and
   the dashboard. State lives in sessionStorage, so a refresh keeps your
   place and closing the tab forgets you entirely.

   The two engines here — routeQuestion() and assistantAnswer() — are ports of
   the ones written and unit-tested for the UniMate codebase. Their behaviour
   is the point of the whole thing, so they are kept honest rather than
   simplified for a demo.
   ========================================================================== */

/* --- text handling -------------------------------------------------------
   A student types two languages, usually without diacritics, often
   misspelled. Everything is folded to one comparable shape first.          */

const ARABIC_MARKS = /[ً-ٰٟـۖ-ۭ]/g;

function foldArabic(s){
  return s.replace(ARABIC_MARKS,'')
    .replace(/[آأإٱ]/g,'ا')  // آ أ إ ٱ → ا
    .replace(/ى/g,'ي')                       // ى → ي
    .replace(/ة/g,'ه')                       // ة → ه
    .replace(/[ؤئ]/g,'ء');              // ؤ ئ → ء
}
function foldDigits(s){
  return s.replace(/[٠-٩۰-۹]/g,d=>String(d.charCodeAt(0)&0x0f));
}
function normalise(s){
  return foldArabic(foldDigits(String(s||'').toLowerCase().normalize('NFKD')
    .replace(/[̀-ͯ]/g,'')))
    .replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
}

/* Short on purpose: an aggressive stop list throws away the difference
   between "can I add a course" and "can I drop a course".                  */
const STOP = new Set(('a an the is are was were be been am i me my we our you your it its they '
 +'to of in on at for from by with about and or but if so as that this there do does did can '
 +'could will would should have has had get got please hello hi thanks how what when where why '
 +'who whom whose which need want know tell kindly regards').split(' ')
 .concat('في من على الى عن مع هل ما ماذا انا هو هي او و ان التي الذي لو كان يوجد ممكن شكرا كيف متى اين لماذا وش شنو ليش وين ابغى اريد'.split(' ')));

function stem(w){
  if(w.length<=3) return w;
  for(const suf of ['ations','ation','ing','ies','ed','es','s']){
    if(w.endsWith(suf) && w.length-suf.length>=3){
      const base=w.slice(0,-suf.length);
      return suf==='ies' ? base+'y' : base;
    }
  }
  return w;
}
function terms(s){
  return [...new Set(normalise(s).split(' ')
    .filter(w=>w.length>1 && !STOP.has(w)).map(stem))];
}

         w:['letter','card','lost','book','كتاب','ضائع']},

const STRONG=3, WEAK=1, SUBJ_MULT=1.5, SATURATION=6;
const CONFIDENT = 0.55;

function scoreList(list, weight, hay, toks, mult, hits){
  let total=0;
  for(const sig of list){
    const hit = sig.includes(' ') ? hay.includes(normalise(sig)) : toks.has(stem(normalise(sig)));
    if(hit){ total += weight*mult; hits.add(sig); }
  }
  return total;
}

/* Confidence blends two worries: whether there was enough evidence at all,
   and whether the winner actually beat the runner-up. Weighted towards the
   margin, because the usual failure is two departments both plausibly owning
   the same sentence.                                                        */
function confidenceOf(top, second){
  if(top<=0) return 0;
  const strength = Math.min(1, top/SATURATION);
  const margin = (top-second)/top;
  return Math.round((0.4*strength + 0.6*margin)*1000)/1000;
}

function routeQuestion(subject, body, chosen){
  const sHay=normalise(subject), bHay=normalise(body);
  const sTok=new Set(terms(subject)), bTok=new Set(terms(body));

  const scores = CATS.map(cat=>{
    const sig=SIGNALS[cat], hits=new Set();
    const score =
      scoreList(sig.s,STRONG,sHay,sTok,SUBJ_MULT,hits) +
      scoreList(sig.w,WEAK,  sHay,sTok,SUBJ_MULT,hits) +
      scoreList(sig.s,STRONG,bHay,bTok,1,hits) +
      scoreList(sig.w,WEAK,  bHay,bTok,1,hits);
    return {cat, score:Math.round(score*100)/100, hits:[...hits]};
  }).sort((a,b)=>b.score-a.score);

  const best=scores[0], next=scores[1];
  const conf = confidenceOf(best.score, next?next.score:0);

  if(best.score===0){
    return {cat: chosen||'other', conf: chosen?0.3:0, method: chosen?'student':'rules', hits:[], scores};
  }
  // Unsure, and the student told us what they think. Their answer beats a
  // coin flip between two weak keyword scores.
  if(conf<CONFIDENT && chosen && chosen!==best.cat){
    return {cat:chosen, conf:Math.max(conf,0.35), method:'student', hits:best.hits, scores, runnerUp:best.cat};
  }
  return {cat:best.cat, conf, method:'rules', hits:best.hits, scores};
}

function departmentFor(cat){
  return DEPTS.find(d=>d.cats.includes(cat)) || DEPTS.find(d=>d.cats.includes('other')) || DEPTS[0];
}

/* --- retrieval -----------------------------------------------------------
   The assistant is built on this and nothing else. There is no generative
   step, so it cannot state a policy nobody published: every sentence it
   shows is the `a` field of an entry above.                                */
const Q_W=3, K_W=2.5, A_W=1;
const ANSWER_FLOOR=0.5, LIST_FLOOR=0.12, DECISIVE=0.15;

const INDEX = FAQ.map(f=>({
  f,
  q:new Set([...terms(f.q[0]),...terms(f.q[1])]),
  k:new Set(f.k.flatMap(x=>terms(x))),
  a:new Set([...terms(f.a[0]),...terms(f.a[1])]),
}));

function scoreEntry(qt, ix){
  let weighted=0, strong=0; const matched=[];
  for(const t of qt){
    let w=0;
    if(ix.q.has(t)) w=Q_W; else if(ix.k.has(t)) w=K_W; else if(ix.a.has(t)) w=A_W;
    if(w>0){ weighted+=w; matched.push(t); if(w>A_W) strong++; }
  }
  const coverage = qt.length ? matched.length/qt.length : 0;
  const density  = qt.length ? weighted/(Q_W*qt.length) : 0;
  let score = 0.6*coverage + 0.4*density;
  // Matching only words that happen to appear in an answer body is how you
  // get confidently wrong.
  const weak = strong===0;
  if(weak) score *= 0.5;
  return {f:ix.f, score:Math.round(score*1000)/1000, matched, weak};
}

function searchFaq(query, cat, limit){
  limit = limit || 8;
  const pool = INDEX.filter(ix=>!cat || ix.f.c===cat);
  const qt = terms(query);
  if(!qt.length){
    return pool.slice(0,limit).map(ix=>({f:ix.f,score:0,matched:[],weak:false}));
  }
  return pool.map(ix=>scoreEntry(qt,ix))
    .filter(m=>m.score>=LIST_FLOOR)
    .sort((a,b)=>b.score-a.score || a.f.order-b.f.order)
    .slice(0,limit);
}

/* Answers only above the floor AND clear of the runner-up. Without the
   margin, one word like "deadline" scores perfectly against every answer
   containing it, and picking one is exactly the confident guess this
   assistant must not make.                                                 */
function assistantAnswer(query){
  const m = searchFaq(query, null, 4);
  const best = m[0];
  const second = m[1] ? m[1].score : 0;
  const margin = best && best.score>0 ? (best.score-second)/best.score : 0;
  const ok = best && best.score>=ANSWER_FLOOR && !best.weak && margin>=DECISIVE;
  if(!ok) return {answered:false, near:m.slice(0,3), suggest:best?best.f.c:null};
  return {answered:true, entry:best.f, conf:best.score, near:m.slice(1,3)};
}

/* --- tiny helpers ---------------------------------------------------------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

function fmtWhen(iso){
  const d=new Date(iso), now=new Date();
  const mins=Math.round((now-d)/60000);
  if(mins<60) return t('minutes').replace('{n}',mins);
  if(mins<60*36) return t('hours').replace('{n}',Math.round(mins/60));
  return d.toLocaleDateString(LANG==='ar'?'ar':'en-GB',{day:'numeric',month:'short'});
}
function fmtDur(mins){
  if(mins==null) return t('noAvg');
  if(mins<90) return t('minutes').replace('{n}',Math.round(mins));
  if(mins<60*48) return t('hours').replace('{n}',Math.round(mins/60));
  return t('days').replace('{n}',Math.round(mins/1440));
}
const STATUS_CLASS = {submitted:'b-grey',under_review:'b-blue',waiting_student:'b-yellow',answered:'b-pink',resolved:'b-green'};
function statusBadge(s){ return '<span class="badge '+STATUS_CLASS[s]+'">'+esc(t('st_'+s))+'</span>'; }

function toast(msg){
  const box=$('#toast');
  box.innerHTML='<div>'+esc(msg)+'</div>';
  clearTimeout(toast._x);
  toast._x=setTimeout(()=>{box.innerHTML='';},2600);
}

function notify(kind, q){

  }
  const r = routeQuestion(s,b,c);
  const d = departmentFor(r.cat);
  let why;
  if(r.conf>=CONFIDENT && r.hits.length){
    why = t('routeWhy').replace('{terms}', r.hits.slice(0,3).map(h=>'“'+h+'”').join(', '));
  } else if(r.method==='student'){ why = t('routeChoice'); }
  else { why = t('routeUnsure'); }

  box.innerHTML = '<p style="margin:0;font-family:var(--display);font-weight:600">'+esc(d[LANG])+'</p>'
    + '<p style="margin:.5rem 0 0"><span class="badge b-yellow">'+esc(catName(r.cat))+'</span></p>'

    +   '<a href="mailto:'+esc(d.email)+'">'+esc(d.email)+'</a></p>';

function submitQuestion(e){
  e.preventDefault();
  const subject=$('#aSubject').value.trim(), body=$('#aBody').value.trim(), chosen=$('#aCategory').value;
  if(subject.length<3 || body.length<15) return;

  // Routing is recomputed here rather than read off the preview, so what is
  // recorded is always what the engine actually decided.
  const r = routeQuestion(subject, body, chosen);
  const d = departmentFor(r.cat);
  const files = [...($('#aFiles').files||[])].slice(0,3).map(f=>f.name);
  const now = new Date().toISOString();

  const q = {
    id:'q'+Date.now(), ref:nextRef(), subject, body,
    cat:r.cat, dept:d.slug, method:r.method, conf:r.conf, hits:r.hits,
    status:'submitted', created:now, firstReply:null, files,
    msgs:[], events:[{k:'submitted',at:now},{k:'routed',at:now}],
  };
  DB.questions.unshift(q);
  DB.ref = refCounter;
  notify('received', q);
  save();

  e.target.reset();
  renderRoutePreview();
  toast(t('toastSent'));
  OPEN_ID=q.id; renderThread(); show('thread');
  renderAll();
}

  $('#inboxLede').textContent = t('inboxLede').replace('{d}', deptName(STAFF_DEPT));

  $('#inboxFilters').innerHTML =
    DEPTS.map(d=>'<button class="chip" data-dept="'+d.slug+'" aria-pressed="'+(STAFF_DEPT===d.slug)+'">'+esc(d[LANG])+'</button>').join('')
    + '<span style="flex-basis:100%;height:0"></span>'
    + [['all','fAll'],['new','fNew'],['unanswered','fUnanswered'],['waiting','fWaiting']]
      .map(([v,k])=>'<button class="chip" data-inbox="'+v+'" aria-pressed="'+(INBOX_FILTER===v)+'">'+esc(t(k))+'</button>').join('');

  let list = queueFor(STAFF_DEPT);
  if(INBOX_FILTER==='new') list=list.filter(q=>q.status==='submitted');
  if(INBOX_FILTER==='unanswered') list=list.filter(q=>!q.firstReply && q.status!=='resolved');
  if(INBOX_FILTER==='waiting') list=list.filter(q=>q.status==='waiting_student');

  $('#inboxList').innerHTML = list.length
    ? list.map(q=>'<button class="qrow" data-staff="'+q.id+'">'
        + '<span style="display:flex;gap:.7rem;align-items:flex-start;justify-content:space-between">'
        +   '<span style="min-width:0"><span class="t" style="display:block">'+esc(q.subject)+'</span>'
        +   '<span class="b">'+esc(q.body)+'</span></span>'
        +   '<span style="display:flex;flex-direction:column;gap:.3rem;align-items:flex-end">'+statusBadge(q.status)
        +   (!q.firstReply && q.status!=='resolved' ? '<span class="badge b-yellow">'+esc(t('fUnanswered'))+'</span>':'')
        +   '</span></span>'
        + '<span class="f"><span class="ref">'+esc(q.ref)+'</span><span>'+esc(ME)+'</span>'
        +   '<span style="margin-inline-start:auto">'+esc(fmtWhen(q.created))+'</span></span></button>').join('')
    : '<div class="empty"><div class="big">✅</div><p>'+esc(t('inboxEmpty'))+'</p></div>';
}

  +     (q.hits&&q.hits.length?'<p class="tiny muted" style="margin:.5rem 0 0">'+esc(q.hits.join(', '))+'</p>':'')+'</div>'

  +     '<ul class="tl mt2">'+q.events.map(e=>'<li><span class="pip"></span><span>'
          + esc(t('ev_'+(e.k==='status_changed'?'status':e.k)))+'<time>'+esc(fmtWhen(e.at))+'</time></span></li>').join('')+'</ul></div>'

/* --- dashboard ----------------------------------------------------------------- */
function renderDash(){
  const qs=DB.questions;
  if(!qs.length){ $('#dashBody').innerHTML='<div class="empty"><p>'+esc(t('dNone'))+'</p></div>'; return; }

  const today=new Date().toDateString();
  const totals={
    total:qs.length,
    newToday:qs.filter(q=>new Date(q.created).toDateString()===today).length,
    open:qs.filter(q=>q.status!=='resolved').length,
    unanswered:qs.filter(q=>!q.firstReply && q.status!=='resolved').length,
    resolved:qs.filter(q=>q.status==='resolved').length,
  };
  // Averaged over the questions that actually got a reply — an unanswered
  // one would otherwise quietly improve the average.
  const replied=qs.filter(q=>q.firstReply);
  const avgFirst = replied.length
    ? replied.reduce((s,q)=>s+(new Date(q.firstReply)-new Date(q.created))/60000,0)/replied.length : null;

  const byDept={}; DEPTS.forEach(d=>byDept[d.slug]=0);
  qs.forEach(q=>byDept[q.dept]=(byDept[q.dept]||0)+1);
  const deptRows=Object.entries(byDept).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);

  const byCat={}; qs.forEach(q=>byCat[q.cat]=(byCat[q.cat]||0)+1);
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  const faqRows=Object.entries(DB.hits||{}).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxD=Math.max(...deptRows.map(r=>r[1]),1), maxC=Math.max(...catRows.map(r=>r[1]),1);

  const bars=(rows,max,label)=>rows.map(([k,n])=>
    '<div class="bar"><span class="nm">'+esc(label(k))+'</span>'
    + '<span class="tr"><span class="fl" style="width:'+Math.round(n/max*100)+'%"></span></span>'
    + '<span class="vl">'+n+'</span></div>').join('');

  $('#dashBody').innerHTML =
    '<div class="grid cols-4">'
  +   '<div class="stat"><div class="k">'+esc(t('dNew'))+'</div><div class="v">'+totals.newToday+'</div></div>'
  +   '<div class="stat"><div class="k">'+esc(t('dUnanswered'))+'</div><div class="v" style="color:'+(totals.unanswered?'var(--yellow)':'var(--green)')+'">'+totals.unanswered+'</div></div>'
  +   '<div class="stat"><div class="k">'+esc(t('dOpen'))+'</div><div class="v">'+totals.open+'</div></div>'
  +   '<div class="stat"><div class="k">'+esc(t('dResolved'))+'</div><div class="v" style="color:var(--green)">'+totals.resolved+'</div></div>'
  + '</div>'
  + '<div class="grid cols-2 mt2">'
  +   '<div class="stat"><div class="k">'+esc(t('dFirst'))+'</div><div class="v" style="font-size:1.25rem">'+esc(fmtDur(avgFirst))+'</div></div>'
  +   '<div class="stat"><div class="k">'+esc(t('dTotal'))+'</div><div class="v" style="font-size:1.25rem">'+totals.total+'</div></div>'
  + '</div>'
  + '<div class="grid cols-2 mt3">'
  +   '<div class="card"><h2>'+esc(t('dByDept'))+'</h2>'+bars(deptRows,maxD,deptName)+'</div>'
  +   '<div class="card"><h2>'+esc(t('dByCat'))+'</h2>'+bars(catRows,maxC,catName)+'</div>'
  + '</div>'
  + '<div class="card mt3"><h2>'+esc(t('dTopFaq'))+'</h2>'
  +   (faqRows.length ? '<ol style="margin:0;padding-inline-start:1.2rem" class="small">'
      + faqRows.map(([id,n])=>{
          const f=FAQ.find(x=>x.id===id); if(!f) return '';
          return '<li style="margin:.35rem 0"><span>'+esc(f.q[LANG==='ar'?1:0])+'</span> '
            + '<span class="tiny muted ref">· '+n+'</span></li>';
        }).join('') + '</ol>'
      : '<p class="small muted" style="margin:0">'+esc(t('dNone'))+'</p>')
  + '</div>';
}

/* --- render everything --------------------------------------------------------- */
function renderAll(){
  applyStaticCopy();
  renderTabs();
  renderTiles();
  renderSearch();
  renderNotifs();
  renderHomeQuestions();
  renderCategorySelect();
  renderRoutePreview();
  renderMine();
  if(ROLE==='staff'){ renderInbox(); renderDash(); }
  if(VIEW==='thread'){ ROLE==='staff' && OPEN_STAFF ? renderStaffThread() : renderThread(); }
  save();
}

let OPEN_STAFF = false;

/* --- events --------------------------------------------------------------------- */
document.addEventListener('click', e=>{
  const tab = e.target.closest('[data-tab]');
  if(tab){ OPEN_STAFF=false; show(tab.dataset.tab); if(tab.dataset.tab==='inbox') renderInbox(); if(tab.dataset.tab==='dash') renderDash(); return; }

  const go = e.target.closest('[data-go]');
  if(go){
    if(go.dataset.prefill){ $('#aSubject').value = go.dataset.prefill; }
    if(go.dataset.catPrefill){ $('#aCategory').value = go.dataset.catPrefill; }
    show(go.dataset.go);
    if(go.dataset.go==='ask') renderRoutePreview();
    if(go.dataset.go==='mine') renderMine();
    return;
  }

  const tile = e.target.closest('[data-cat]');
  if(tile){ CAT_FILTER = CAT_FILTER===tile.dataset.cat ? null : tile.dataset.cat; renderTiles(); renderSearch(); return; }

  const faqBtn = e.target.closest('.faq .q');
  if(faqBtn){
    const card=faqBtn.closest('.faq'), body=card.querySelector('.a');
    const open = card.getAttribute('open-state')==='1';
    card.setAttribute('open-state', open?'0':'1');
    faqBtn.setAttribute('aria-expanded', String(!open));
    body.hidden = open;
    if(!open){ const id=card.dataset.faq; DB.hits[id]=(DB.hits[id]||0)+1; save(); }
    return;
  }

  const open = e.target.closest('[data-open]');
  if(open){
    OPEN_ID=open.dataset.open; OPEN_STAFF=false;
    DB.notifs.forEach(n=>{ if(n.qid===OPEN_ID) n.read=true; });
    renderThread(); show('thread'); renderNotifs(); renderTabs(); save(); return;
  }

  const staffOpen = e.target.closest('[data-staff]');
  if(staffOpen){ OPEN_ID=staffOpen.dataset.staff; OPEN_STAFF=true; renderStaffThread(); show('thread'); return; }

  if(e.target.id==='readAll'){
    DB.notifs.forEach(n=>n.read=true); save(); renderNotifs(); renderTabs(); toast(t('toastRead')); return;
  }

  const mine = e.target.closest('[data-mine]');
  if(mine){ MINE_FILTER=mine.dataset.mine; renderMine(); return; }

  const inbox = e.target.closest('[data-inbox]');
  if(inbox){ INBOX_FILTER=inbox.dataset.inbox; renderInbox(); return; }

  const dept = e.target.closest('[data-dept]');
  if(dept){ STAFF_DEPT=dept.dataset.dept; renderInbox(); renderTabs(); return; }

  const act = e.target.closest('[data-act]');
  if(act){
    const q=DB.questions.find(x=>x.id===OPEN_ID); if(!q) return;
    const now=new Date().toISOString();
    if(act.dataset.act==='resolve'){ q.status='resolved'; q.events.push({k:'resolved',at:now}); toast(t('toastResolved')); }
    if(act.dataset.act==='reopen'){ q.status='submitted'; q.events.push({k:'reopened',at:now}); toast(t('toastReopened')); }
    save(); renderThread(); renderAll(); return;
  }

  const sact = e.target.closest('[data-sact]');
  if(sact){
    const q=DB.questions.find(x=>x.id===OPEN_ID); if(!q) return;
    const now=new Date().toISOString();
    if(sact.dataset.sact==='waiting'){ q.status='waiting_student'; q.events.push({k:'status_changed',at:now}); notify('waiting',q); }
    if(sact.dataset.sact==='resolve'){ q.status='resolved'; q.events.push({k:'resolved',at:now}); notify('resolved',q); }
    save(); renderStaffThread(); renderAll(); return;
  }
});

document.addEventListener('submit', e=>{
  if(e.target.id==='askForm'){ submitQuestion(e); return; }

  if(e.target.id==='assistForm'){
    e.preventDefault(); renderAssistant($('#assistInput').value.trim()); return;
  }

  if(e.target.id==='replyForm'){
    e.preventDefault();
    const q=DB.questions.find(x=>x.id===OPEN_ID); if(!q) return;
    const body=$('#replyBody').value.trim(); if(!body) return;
    const now=new Date().toISOString();
    q.msgs.push({who:'student',body,at:now});
    q.events.push({k:'student_replied',at:now});
    // The department was waiting on them; now it is not.
    if(q.status==='waiting_student') q.status='under_review';
    save(); renderThread(); renderAll(); toast(t('toastReply')); return;
  }

  if(e.target.id==='staffForm'){
    e.preventDefault();
    const q=DB.questions.find(x=>x.id===OPEN_ID); if(!q) return;
    const body=$('#staffBody').value.trim(); if(!body) return;
    const internal=$('#staffInternal').checked;
    const now=new Date().toISOString();
    q.msgs.push({who:'staff',dept:q.dept,body,internal,at:now});
    q.events.push({k:'staff_replied',at:now});
    // An internal note is not an answer, so it does not stop the clock and
    // the student is not told about it.
    if(!internal){
      if(!q.firstReply) q.firstReply=now;
      if(q.status!=='resolved') q.status='answered';
      notify('replied', q);
    }
    save(); renderStaffThread(); renderAll(); toast(t('toastReply')); return;
  }

  if(e.target.id==='transferForm'){
    e.preventDefault();
    const q=DB.questions.find(x=>x.id===OPEN_ID); if(!q) return;
    const to=$('#tDept').value, note=$('#tNote').value.trim();
    const now=new Date().toISOString();
    if(note) q.msgs.push({who:'staff',dept:q.dept,body:note,internal:true,at:now});
    q.dept=to; q.method='manual';
    if(q.status==='answered'||q.status==='resolved') q.status='under_review';
    q.events.push({k:'transferred',at:now});
    notify('transferred', q);
    save(); toast(t('transferred'));
    OPEN_STAFF=false; show('inbox'); renderAll(); return;
  }
});

$('#q').addEventListener('input', renderSearch);
['#aSubject','#aBody','#aCategory'].forEach(s=>{
  document.addEventListener('input', e=>{ if(e.target.matches(s)) renderRoutePreview(); });
  document.addEventListener('change', e=>{ if(e.target.matches(s)) renderRoutePreview(); });
});

$('#langBtn').addEventListener('click', ()=>{ LANG = LANG==='en' ? 'ar' : 'en'; renderAll(); if(VIEW==='thread'){ OPEN_STAFF?renderStaffThread():renderThread(); } });
$('#roleBtn').addEventListener('click', ()=>{
  ROLE = ROLE==='student' ? 'staff' : 'student';
  if(ROLE==='student' && (VIEW==='inbox'||VIEW==='dash')) show('home');
  OPEN_STAFF=false;
  renderAll();
});

DB = load();
if(DB.ref) refCounter = DB.ref;

renderAll();
show('home');
</script>
